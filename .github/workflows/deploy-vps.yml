name: Deploy FCP

on:
  push:
    branches:
      - main

concurrency:
  group: fcp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, fcp-vps]

    steps:
      - name: Update application
        run: |
          cd /opt/apps/fcp
          git fetch origin main
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f